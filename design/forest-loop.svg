<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Forest Trail：松溪环线策划示意</title>
  <desc id="desc">原创拓扑图。由营地经林窗小屋、浅溪、泥地岔口到山脊望台，再沿湖岸返回。两条可选近路与主线汇合；不是原作地图，不按比例。</desc>
  <defs>
    <pattern id="paper" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.7" fill="#d8ded0"/></pattern>
    <g id="pine"><path d="M0 -20L-10 -2H-6L-13 11H13L6 -2H10Z" fill="#5f7c5b"/><path d="M0 9V18" stroke="#6b6650" stroke-width="3"/></g>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ac653f"/></marker>
    <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#263e33}.small{font-size:14px;fill:#5c6b60}.label{font-size:18px;font-weight:700}.node{fill:#f6f2e5;stroke:#365446;stroke-width:3}.letter{font-size:17px;font-weight:700;text-anchor:middle;dominant-baseline:central}.route{fill:none;stroke:#ac653f;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.shortcut{fill:none;stroke:#647356;stroke-width:4;stroke-dasharray:8 8}.contour{fill:none;stroke:#9db296;stroke-width:1.4;opacity:.45}</style>
  </defs>
  <rect width="1200" height="760" rx="20" fill="#f3f0e4"/>
