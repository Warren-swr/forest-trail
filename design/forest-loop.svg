  <text x="451" y="252" class="small">岩阶近路</text>
  <text x="653" y="567" class="small">疏林湖岸</text>
  <g><circle class="node" cx="150" cy="563" r="19"/><text class="letter" x="150" y="563">A</text><text class="label" x="78" y="609">出发／营地</text></g>
  <g><circle class="node" cx="182" cy="291" r="19"/><text class="letter" x="182" y="291">B</text><text class="label" x="112" y="256">林窗小屋 ①</text></g>
  <g><circle class="node" cx="382" cy="393" r="19"/><text class="letter" x="382" y="393">C</text><text class="label" x="305" y="365">浅溪石滩 ②</text></g>
  <g><circle class="node" cx="581" cy="400" r="19"/><text class="letter" x="581" y="400">D</text><text class="label" x="607" y="432">泥地岔口</text></g>
  <g><circle class="node" cx="588" cy="191" r="19"/><text class="letter" x="588" y="191">E</text><text class="label" x="610" y="145">山脊望台 ③</text></g>
  <g><circle class="node" cx="445" cy="607" r="19"/><text class="letter" x="445" y="607">F</text><text class="label" x="371" y="571">湖岸回程</text></g>
  <g transform="translate(865 126)">
    <text font-size="20" font-weight="700">一段完整的短途旅程</text>
    <text y="35" class="small">约 1.4 km 主线 / 首次 15–25 分钟</text>
    <path d="M0 70H47" class="route"/><text x="65" y="75" font-size="16">常规环线：原厂车可通行</text>
    <path d="M0 103H47" class="shortcut"/><text x="65" y="108" font-size="16">可选近路：更短、更难</text>
    <path d="M0 143H292" stroke="#c7cdbd"/>
    <text y="181" class="label">节奏编排</text>
    <text y="215" font-size="16">起步 → 读地形 → 过浅溪</text>
    <text y="245" font-size="16">选线 → 爬坡 → 看见整片山林</text>
    <text y="275" font-size="16">轻松回程 → 留下旅途记录</text>
    <path d="M0 309H292" stroke="#c7cdbd"/>
    <text y="348" class="label">制作约束</text>
    <text y="382" font-size="16">三处景点独立构图</text>
    <text y="412" font-size="16">挑战前后均有安全停车位置</text>
    <text y="442" font-size="16">泥坑附近手工布置绞盘锚点</text>
    <text y="472" font-size="16">不设倒计时与强制升级门槛</text>
    <text y="524" class="small">尺寸与道路长度是策划目标，</text>
    <text y="547" class="small">须通过驾驶灰盒调整。</text>
  </g>
  <text x="39" y="741" class="small">策划版本 0.1 · 2026-09-25 · 本图用于空间关系与体验节奏讨论，不是可玩关卡截图。</text>
</svg>
