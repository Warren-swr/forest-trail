  <text x="38" y="76" class="small">原创关卡拓扑 · 640 × 640 m 地图提案 · 非比例示意 · 非原作地图</text>
  <rect x="28" y="99" width="802" height="616" rx="18" fill="#e6eadb"/>
  <rect x="28" y="99" width="802" height="616" rx="18" fill="url(#paper)"/>
